<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Friends</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone" role="application" aria-label="Family Friends">

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">FF</div>
      <div>
        <p class="brand-name">Family Friends</p>
        <p class="brand-circle" id="circleName">Müller &amp; Friends</p>
      </div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Menü">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <!-- ===== ÜBERSICHT ===== -->
  <section class="screen" id="screen-uebersicht" data-screen>
    <p class="balance-label">Im Umlauf</p>
    <p class="balance-value"><span id="balanceValue">0</span><span class="balance-currency">&nbsp;€</span></p>
    <p class="balance-sub" id="balanceSub">0 Mitglieder · 0 laufende Darlehen</p>

    <div class="actions">
      <button class="action primary" id="btnLend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
        Geld verleihen
      </button>
      <button class="action secondary" id="btnBorrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        Geld leihen
      </button>
    </div>
    <button class="action tertiary full" id="btnNewRequestFromHome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
      Anfrage stellen
    </button>

    <div class="section-head" style="margin-top:22px;">
      <p class="section-label">Aktive Darlehen</p>
      <button class="link-btn" data-goto="darlehen">Alle ansehen</button>
    </div>
    <div id="loanPreviewList" class="loan-list"></div>

    <div class="section-head" style="margin-top:22px;">
      <p class="section-label">Letzte Aktivität</p>
    </div>
    <div class="activity" id="activityPreviewList"></div>
  </section>

  <!-- ===== DARLEHEN ===== -->
  <section class="screen" id="screen-darlehen" data-screen hidden>
    <div class="screen-title-row">
      <h2 class="screen-title">Darlehen</h2>
      <button class="pill-btn" id="btnNewLoanFromList">+ Neu</button>
    </div>

    <div class="summary-card">
      <div class="summary-row">
        <span>Gesamt verliehen</span>
        <strong id="sumVerliehen">0&nbsp;€</strong>
      </div>
      <div class="summary-row">
        <span>Gesamt geliehen</span>
        <strong id="sumGeliehen">0&nbsp;€</strong>
      </div>
      <div class="summary-row net">
        <span>Netto-Position</span>
        <strong id="sumNetto">0&nbsp;€</strong>
      </div>
    </div>

    <div class="filter-row">
      <button class="filter active" data-filter="alle">Alle</button>
      <button class="filter" data-filter="verliehen">Verliehen</button>
      <button class="filter" data-filter="geliehen">Geliehen</button>
    </div>
    <div id="loanFullList" class="loan-list"></div>
  </section>

  <!-- ===== ANFRAGEN ===== -->
  <section class="screen" id="screen-anfragen" data-screen hidden>
    <div class="screen-title-row">
      <h2 class="screen-title">Anfragen</h2>
      <button class="pill-btn" id="btnNewRequest">+ Anfrage</button>
    </div>

    <p class="section-label">Offen</p>
    <div id="requestOpenList" class="loan-list"></div>

    <p class="section-label" style="margin-top:20px;">Verlauf</p>
    <div id="requestHistoryList" class="loan-list"></div>
  </section>

  <!-- ===== KREIS ===== -->
  <section class="screen" id="screen-kreis" data-screen hidden>
    <div class="screen-title-row">
      <h2 class="screen-title">Kreis</h2>
      <button class="pill-btn" id="btnNewMember">+ Person</button>
    </div>
    <div id="memberList" class="member-list"></div>
  </section>

  <!-- ===== AKTIVITÄT ===== -->
  <section class="screen" id="screen-aktivitaet" data-screen hidden>
    <h2 class="screen-title">Aktivität</h2>
    <div class="activity" id="activityFullList"></div>
  </section>

  <nav class="tab-bar">
    <button class="tab active" data-tab="uebersicht" aria-label="Übersicht">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
    </button>
    <button class="tab" data-tab="darlehen" aria-label="Darlehen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
    </button>
    <button class="tab" data-tab="anfragen" aria-label="Anfragen">
      <span class="tab-badge" id="requestBadge" hidden></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
    </button>
    <button class="tab" data-tab="kreis" aria-label="Kreis">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"/><path d="M2 21v-2a5 5 0 015-5h4a5 5 0 015 5v2"/><circle cx="18" cy="9" r="2.5"/><path d="M15.5 21v-1.5a4 4 0 014-4"/></svg>
    </button>
    <button class="tab" data-tab="aktivitaet" aria-label="Aktivität">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
    </button>
  </nav>
</div>

<!-- ===== MODAL: Neues Darlehen ===== -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle">Geld verleihen</h3>
      <button class="icon-btn" id="modalClose" aria-label="Schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <form id="loanForm">
      <input type="hidden" id="loanDirection" value="verliehen">
      <label class="field">
        <span>Person</span>
        <select id="loanPerson" required></select>
      </label>
      <label class="field">
        <span>Verwendungszweck</span>
        <input type="text" id="loanPurpose" placeholder="z. B. Autoreparatur">
      </label>
      <label class="field">
        <span>Betrag (€)</span>
        <input type="number" id="loanAmount" min="1" step="1" required placeholder="300">
      </label>
      <div class="field-row">
        <label class="field">
          <span>Raten</span>
          <input type="number" id="loanInstallments" min="1" step="1" required placeholder="6">
        </label>
        <label class="field">
          <span>Zins (%)</span>
          <input type="number" id="loanInterest" min="0" step="0.1" required placeholder="2">
        </label>
      </div>
      <button type="submit" class="action primary full">Darlehen anlegen</button>
    </form>
  </div>
</div>

<!-- ===== MODAL: Neue Anfrage ===== -->
<div class="modal-overlay" id="requestModalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="requestModalTitle">
    <div class="modal-head">
      <h3 id="requestModalTitle">Anfrage stellen</h3>
      <button class="icon-btn" id="requestModalClose" aria-label="Schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <form id="requestForm">
      <label class="field">
        <span>Person</span>
        <select id="requestPerson" required></select>
      </label>
      <label class="field">
        <span>Verwendungszweck</span>
        <input type="text" id="requestPurpose" placeholder="z. B. neue Waschmaschine" required>
      </label>
      <label class="field">
        <span>Betrag (€)</span>
        <input type="number" id="requestAmount" min="1" step="1" required placeholder="250">
      </label>
      <div class="field-row">
        <label class="field">
          <span>Gewünschte Raten</span>
          <input type="number" id="requestInstallments" min="1" step="1" required placeholder="5">
        </label>
        <label class="field">
          <span>Zins (%)</span>
          <input type="number" id="requestInterest" min="0" step="0.1" required placeholder="2">
        </label>
      </div>
      <button type="submit" class="action primary full">Anfrage senden</button>
    </form>
  </div>
</div>

<!-- ===== MODAL: Neue Person ===== -->
<div class="modal-overlay" id="memberModalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="memberModalTitle">
    <div class="modal-head">
      <h3 id="memberModalTitle">Person hinzufügen</h3>
      <button class="icon-btn" id="memberModalClose" aria-label="Schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <form id="memberForm">
      <label class="field">
        <span>Name</span>
        <input type="text" id="memberName" required placeholder="z. B. Tante Sabine">
      </label>
      <button type="submit" class="action primary full">Hinzufügen</button>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
